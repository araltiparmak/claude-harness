# Skills from other repos. scripts/update/update.sh clones each repo, links the skills listed
# under it into ~/.claude/skills, and unlinks a skill once its line is gone.
#
# Each repo is its https URL as a key; under it, one skill per line, by the `name:` in
# that skill's SKILL.md. scripts/check/check.sh rejects any other shape.

