<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
  /* worklog.py fills in the title and the body. Colours: light values first, dark below. */
  :root {
    color-scheme: light dark;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --hairline: #e1e0d9; --axis: #c3c2b7; --wash: rgba(42, 120, 214, 0.14);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --on-s4: #0b0b0b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7;
      --hairline: #2c2c2a; --axis: #383835; --wash: rgba(57, 135, 229, 0.2);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --on-s4: #fff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 16px 72px; background: var(--page); color: var(--ink);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 32px; line-height: 1.15; margin: 0; }
  h2 { font-size: 21px; line-height: 1.25; margin: 0 0 6px; }
  h3 { font-size: 17px; line-height: 1.3; margin: 0; }
  h4 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 16px 0 2px; }
  section { margin-top: 56px; }
  section > h3 { margin: 32px 0 12px; }
  a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--axis); }
  a:hover { text-decoration-color: currentColor; }
  ul { margin: 4px 0 0; padding-left: 20px; overflow-wrap: anywhere; }
  li { margin: 2px 0; }
  small { display: block; color: var(--muted); font-size: 13px; }
  .period { margin: 6px 0 0; color: var(--ink-2); }
  .lede { margin: 20px 0 28px; font-size: 19px; line-height: 1.5; max-width: 62ch; text-wrap: pretty; }
  .intro { margin: 0 0 20px; color: var(--ink-2); max-width: 70ch; }
  .quiet { color: var(--muted); font-size: 14px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .tiles div { background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; padding: 14px 16px; }
  .tiles span { display: block; color: var(--ink-2); font-size: 14px; }
  .tiles b { display: block; font-size: 34px; font-weight: 600; line-height: 1.25; }

  /* Timeline: one row per epic or project; a mark is a day with work, the wash spans first day to last. */
  .timeline { display: grid; grid-template-columns: minmax(110px, max-content) minmax(120px, 1fr) max-content;
              gap: 10px 14px; align-items: center; }
  .row { display: contents; }
  .row .name { max-width: 300px; line-height: 1.3; overflow-wrap: anywhere; }
  .row .value { color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; }
  .track, .axis { position: relative; height: 18px; }
  .track { border-bottom: 1px solid var(--hairline); }
  .track u { position: absolute; top: -5px; bottom: -6px; border-left: 1px solid var(--hairline); }
  .track em { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; background: var(--wash); }
  .track i { position: absolute; top: 3px; bottom: 3px; min-width: 4px; border-radius: 2px; background: var(--s1);
             box-shadow: 0 0 0 1px var(--page); }
  .axis span { position: absolute; bottom: -2px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .row:hover .name, .row:focus .name { text-decoration: underline; }
  .row:focus { outline: none; }
  .timeline + .quiet { margin: 12px 0 0; }

  article { background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; padding: 18px 20px;
            margin-top: 12px; break-inside: avoid; }
  .facts { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }
  .outcome { margin: 12px 0 0; white-space: pre-wrap; max-width: 70ch; }
  article ul { font-size: 15px; }

  .s1 { background: var(--s1); } .s2 { background: var(--s2); } .s3 { background: var(--s3); }
  .s4 { background: var(--s4); } .s5 { background: var(--s5); }
  .split { display: flex; gap: 2px; height: 28px; }
  .split i { flex: 1 0 0; min-width: 3px; border-radius: 4px; padding: 0 8px; overflow: hidden; color: #fff;
             font: 600 13px/28px system-ui, sans-serif; white-space: nowrap; }
  .split i.s4 { color: var(--on-s4); }
  .key td:first-child { font-weight: 600; white-space: nowrap; }
  .key td i, .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); font-size: 14px; }

  /* Stacked columns: the plot is 180px high, with room above for the totals and below for the months. */
  .plot { position: relative; height: 180px; margin: 32px 0 40px 36px; border-bottom: 1px solid var(--axis); }
  .line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--hairline); }
  .line:first-child { border: 0; }
  .line span { position: absolute; right: 100%; top: -9px; padding-right: 8px; color: var(--muted);
               font-size: 12px; font-variant-numeric: tabular-nums; }
  .columns { position: absolute; inset: 0; display: flex; justify-content: space-around; }
  .column { position: relative; flex: 0 1 80px; display: flex; flex-direction: column-reverse; align-items: center;
            gap: 2px; outline-offset: 4px; }
  .column i { width: 24px; flex: none; }
  .column i:last-of-type { border-radius: 4px 4px 0 0; }
  .column b { font-size: 13px; font-weight: 600; }
  .column span { position: absolute; top: 100%; margin-top: 8px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .column:hover i, .column:focus i, .split i:hover, .split i:focus, .row:hover .track i, .row:focus .track i { filter: brightness(1.15); }

  details { color: var(--ink-2); font-size: 14px; }
  summary { cursor: pointer; width: max-content; max-width: 100%; }
  .appendix { margin-top: 56px; border-top: 1px solid var(--hairline); padding-top: 16px; }
  .scroll { overflow-x: auto; margin: 8px 0 16px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 14px 8px 0; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  th { color: var(--ink-2); font-weight: 600; font-size: 13px; }
  .dated td:first-child, .dated td:nth-child(3), .dated td:last-child { white-space: nowrap; }
  .dated td:nth-child(2) { min-width: 220px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 20px; margin: 12px 0 0; font-size: 15px; }
  dt { font-weight: 600; }
  dd { margin: 0; color: var(--ink-2); max-width: 64ch; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }

  #tip { position: fixed; display: none; pointer-events: none; z-index: 1; white-space: pre; background: var(--ink);
         color: var(--page); font-size: 13px; line-height: 1.5; padding: 6px 10px; border-radius: 6px; }
  #tip::first-line { font-weight: 600; }
  @media (max-width: 560px) {
    h1 { font-size: 26px; }
    .lede { font-size: 17px; }
    .timeline { grid-template-columns: minmax(0, 1fr) max-content; }
    .row .name { grid-column: 1 / -1; margin-bottom: -6px; max-width: none; }
    .row:first-child { display: none; }
    dl { grid-template-columns: 1fr; gap: 2px; }
    dd { margin-bottom: 10px; }
  }
  @media print {
    body { background: none; padding: 0; font-size: 12px; }
    section { margin-top: 28px; }
    .appendix, details { display: none; }
  }
</style>
<main>
$body
</main>
<div id="tip" role="status"></div>
<script>
  // One tooltip for every mark that carries data-tip, on hover and on keyboard focus.
  const tip = document.getElementById("tip");
  const show = (mark, x, y) => {
    tip.textContent = mark.dataset.tip;
    tip.style.display = "block";
    tip.style.left = Math.max(8, Math.min(x + 14, innerWidth - tip.offsetWidth - 8)) + "px";
    tip.style.top = Math.max(8, y - tip.offsetHeight - 10) + "px";
  };
  const mark = (target) => target.closest ? target.closest("[data-tip]") : null;
  document.addEventListener("pointermove", (e) => {
    const m = mark(e.target);
    if (m) show(m, e.clientX, e.clientY); else tip.style.display = "none";
  });
  document.addEventListener("focusin", (e) => {
    const m = mark(e.target);
    if (!m) return;
    const box = (m.querySelector("i, .track") || m).getBoundingClientRect();
    show(m, box.left, box.top);
  });
  document.addEventListener("focusout", () => { tip.style.display = "none"; });
</script>
</html>
